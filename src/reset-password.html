<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Baru | SPMB SMK Kasatrian</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-emerald-50 flex items-center justify-center p-4">
  <main class="bg-white w-full max-w-md rounded-2xl shadow-xl p-6 space-y-5">
    <div class="text-center"><h1 class="text-2xl font-bold text-emerald-900">Buat Password Baru</h1><p class="text-xs text-gray-500 mt-2">Masukkan password baru untuk akun SPMB Anda.</p></div>
    <form id="reset-form" class="space-y-4">
      <input id="password" type="password" minlength="6" required placeholder="Password baru, minimal 6 karakter" class="w-full border rounded-lg p-3 text-sm">
      <input id="password-confirm" type="password" minlength="6" required placeholder="Ulangi password baru" class="w-full border rounded-lg p-3 text-sm">
      <button class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-lg p-3">Simpan Password</button>
    </form>
    <p id="message" class="text-center text-xs"></p>
  </main>
<script>
  const token = new URLSearchParams(window.location.search).get('token') || '';
  document.getElementById('reset-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('password-confirm').value;
    const message = document.getElementById('message');
    if (password !== confirm) { message.textContent = 'Konfirmasi password tidak sama.'; message.className = 'text-center text-xs text-red-600'; return; }
    const response = await fetch('../api/reset_password.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password }) });
    const result = await response.json();
    message.textContent = result.message;
    message.className = `text-center text-xs ${result.success ? 'text-emerald-700' : 'text-red-600'}`;
    if (result.success) setTimeout(() => window.location.href = 'login_siswa.html', 1200);
  });
</script>
</body>
</html>
