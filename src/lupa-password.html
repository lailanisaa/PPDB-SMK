<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lupa Password | SPMB SMK Kasatrian Solo Sukoharjo</title>
<link rel="icon" type="image/png" href="Logo_SMK.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Kavoon&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{font-family:'Poppins',sans-serif;}
  .nama-sekolah, .nama-sekolah *{font-family:'Kavoon',cursive !important;}
  :root{ --dark-green:#1B4332; --mint:#D8F5E8; --accent-green:#22C55E; }
  body{font-family:'Poppins',sans-serif; color:var(--dark-green); background:var(--mint);}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="bg-white rounded-2xl shadow-xl border border-emerald-100 max-w-md w-full p-6 sm:p-8 space-y-6">
  <div class="text-center space-y-2">
    <a href="index.html" class="inline-block">
      <img src="Logo_SMK.png" alt="Logo SMK Kasatrian Solo Sukoharjo" class="w-14 h-14 mx-auto object-contain">
    </a>
    <h1 class="font-bold text-2xl text-[var(--dark-green)]">Lupa Password?</h1>
    <p class="text-xs text-gray-500">Masukkan email terdaftar untuk menerima tautan reset kata sandi.</p>
  </div>

  <form id="form-reset" onsubmit="handleReset(event)" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold mb-1 text-gray-700">Email Terdaftar</label>
      <div class="relative">
        <i data-lucide="mail" class="w-4 h-4 absolute left-3 top-3 text-gray-400"></i>
        <input type="email" id="reset-input" required placeholder="contoh@gmail.com" class="w-full pl-9 pr-3 py-2.5 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[var(--accent-green)]">
      </div>
    </div>

    <button type="submit" id="btn-submit" class="w-full bg-[var(--accent-green)] hover:bg-emerald-600 text-white font-bold py-2.5 rounded-lg text-sm flex items-center justify-center gap-2">
      <i data-lucide="send" class="w-4 h-4"></i>
      <span>Kirim Link Reset</span>
    </button>
  </form>

  <div id="success-state" class="hidden p-4 bg-emerald-50 border border-emerald-200 rounded-lg text-center space-y-2">
    <i data-lucide="check-circle" class="w-8 h-8 text-[var(--accent-green)] mx-auto"></i>
    <p class="font-semibold text-sm text-[var(--dark-green)]">Permintaan Reset Terkirim!</p>
    <p id="reset-token-message" class="text-xs text-gray-600"></p>
  </div>

  <div class="pt-4 border-t border-gray-100 flex items-center justify-between text-xs">
    <a href="login_siswa.html" class="text-[var(--accent-green)] font-semibold flex items-center gap-1 hover:underline">
      <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
      <span>Login Siswa</span>
    </a>
    <a href="login_admin.html" class="text-gray-500 hover:underline">Login Admin</a>
  </div>
</div>

<script>
  lucide.createIcons();
  async function handleReset(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.innerHTML = `<span class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span> Memproses...`;
    const response = await fetch('../api/request_reset.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier: document.getElementById('reset-input').value.trim() })
    });
    const result = await response.json();
    if (!result.success) {
      alert(result.message);
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="send" class="w-4 h-4"></i><span>Kirim Link Reset</span>';
      lucide.createIcons();
      return;
    }
    document.getElementById('reset-token-message').textContent = result.message;
    document.getElementById('form-reset').classList.add('hidden');
    document.getElementById('success-state').classList.remove('hidden');
    lucide.createIcons();
  }

</script>
</body>
</html>
