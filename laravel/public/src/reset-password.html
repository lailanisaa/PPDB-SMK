<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | SPMB SMK Kasatrian</title>
  <link rel="icon" type="image/png" href="Logo_SMK.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Poppins', sans-serif; }
    :root { --dark-green: #1B4332; --mint: #D8F5E8; --accent-green: #22C55E; }
    body { color: var(--dark-green); background: var(--mint); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <main class="bg-white rounded-2xl shadow-xl border border-emerald-100 max-w-md w-full p-6 sm:p-8 space-y-6">
    <header class="text-center space-y-2">
      <a href="index.html" class="inline-block">
        <img src="Logo_SMK.png" alt="Logo SMK Kasatrian Solo Sukoharjo" class="w-14 h-14 mx-auto object-contain">
      </a>
      <h1 class="font-bold text-2xl text-[var(--dark-green)]">Buat Password Baru</h1>
      <p class="text-xs text-gray-500">Masukkan password baru untuk akun SPMB Anda.</p>
    </header>

    <form id="reset-form" class="space-y-4">
      <div>
        <label for="password" class="block text-xs font-semibold mb-1 text-gray-700">Password Baru</label>
        <input id="password" type="password" minlength="6" maxlength="72" autocomplete="new-password" required
          placeholder="Minimal 6 karakter" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--accent-green)]">
      </div>
      <div>
        <label for="password-confirm" class="block text-xs font-semibold mb-1 text-gray-700">Konfirmasi Password</label>
        <input id="password-confirm" type="password" minlength="6" maxlength="72" autocomplete="new-password" required
          placeholder="Ulangi password baru" class="w-full border border-gray-200 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--accent-green)]">
      </div>
      <button id="submit-button" type="submit"
        class="w-full bg-[var(--accent-green)] hover:bg-emerald-600 disabled:opacity-60 disabled:cursor-not-allowed text-white font-bold rounded-lg p-3 text-sm flex items-center justify-center gap-2">
        <i data-lucide="key-round" class="w-4 h-4"></i>
        <span>Simpan Password</span>
      </button>
    </form>

    <p id="message" role="status" aria-live="polite" class="text-center text-sm"></p>
    <a id="login-link" href="login_siswa.html"
      class="hidden w-full bg-[var(--dark-green)] hover:bg-emerald-900 text-white font-bold rounded-lg p-3 text-sm text-center">
      Lanjut ke Login Siswa
    </a>
    <div class="pt-4 border-t border-gray-100 text-center text-xs">
      <a href="lupa-password.html" class="text-[var(--accent-green)] font-semibold hover:underline">Minta tautan reset baru</a>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    const resetToken = new URLSearchParams(window.location.search).get('token') || '';
    const resetForm = document.getElementById('reset-form');
    const submitButton = document.getElementById('submit-button');
    const message = document.getElementById('message');
    const loginLink = document.getElementById('login-link');
    const initialButton = submitButton.innerHTML;

    lucide.createIcons();
    if (!/^[a-f0-9]{64}$/i.test(resetToken)) {
      message.textContent = 'Tautan reset tidak valid. Silakan minta tautan reset baru.';
      message.className = 'text-center text-sm text-red-600';
      resetForm.querySelectorAll('input, button').forEach((element) => { element.disabled = true; });
    }

    resetForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirmation = document.getElementById('password-confirm').value;
      if (password !== confirmation) {
        message.textContent = 'Konfirmasi password tidak sama.';
        message.className = 'text-center text-sm text-red-600';
        return;
      }

      submitButton.disabled = true;
      submitButton.innerHTML = '<span class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span><span>Menyimpan...</span>';
      message.textContent = '';
      try {
        const response = await fetch('../api/process_reset.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ token: resetToken, password_baru: password })
        });
        const result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error(result.message || 'Password gagal diperbarui.');
        }

        message.textContent = result.message;
        message.className = 'text-center text-sm text-emerald-700';
        resetForm.classList.add('hidden');
        loginLink.classList.remove('hidden');
      } catch (error) {
        message.textContent = error instanceof Error ? error.message : 'Terjadi kesalahan. Silakan coba lagi.';
        message.className = 'text-center text-sm text-red-600';
        submitButton.disabled = false;
        submitButton.innerHTML = initialButton;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
