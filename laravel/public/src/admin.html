<!-- SCRIPT INTEGRASI REALTIME DINAMIS SINKRON -->
  <script>
    // ==========================================
    // GLOBAL STATE & REALTIME VARIABLES
    // ==========================================
    let activeAdmin = null;
    let pendaftarData = [];
    let jurusanData = [
      { id: 1, kode: "TKJ", nama: "Teknik Komputer & Jaringan", kuota: 100, terisi: 0, buka: true },
      { id: 2, kode: "TKR", nama: "Teknik Kendaraan Ringan", kuota: 90, terisi: 0, buka: true },
      { id: 3, kode: "HTL", nama: "Perhotelan & Pariwisata", kuota: 70, terisi: 0, buka: true },
      { id: 4, kode: "KLN", nama: "Kuliner / Tata Boga", kuota: 60, terisi: 0, buka: false }
    ];
    let pengumumanList = [];
    let staffData = [];
    let selectedVerifId = null;
    let lastStaffHash = '';

    let chartTrenInstance = null;
    let chartDistribusiInstance = null;

    // ==========================================
    // 0. AUTH GUARD & SYSTEM USER LOGGED IN
    // ==========================================
    function getActiveSession() {
      const sessionData = localStorage.getItem('smk_active_session') || 
                          sessionStorage.getItem('smk_active_session') ||
                          localStorage.getItem('currentUser') || 
                          sessionStorage.getItem('currentUser') ||
                          localStorage.getItem('adminData');
      if (sessionData) {
        try { return JSON.parse(sessionData); } catch (e) { return null; }
      }
      return null;
    }

    function initAuthGuardAndAdminData() {
      const parsedUser = getActiveSession();

      if (parsedUser) {
        activeAdmin = {
          nama: parsedUser.nama || parsedUser.name || parsedUser.username || "Admin SPMB",
          role: parsedUser.role || "Panitia SPMB",
          email: parsedUser.email || parsedUser.username || "admin@kasatrian.sch.id",
          telepon: parsedUser.telepon || parsedUser.phone || "",
          foto: parsedUser.foto || parsedUser.avatar || ""
        };
      } else {
        const listAdmin = JSON.parse(localStorage.getItem('adminList') || '[]');
        if (listAdmin.length > 0) {
          const lastRegistered = listAdmin[listAdmin.length - 1];
          activeAdmin = {
            nama: lastRegistered.nama || lastRegistered.username || "Admin Baru",
            role: lastRegistered.role || "Panitia SPMB",
            email: lastRegistered.email || "",
            telepon: lastRegistered.telepon || "",
            foto: lastRegistered.foto || ""
          };
        } else {
          activeAdmin = {
            nama: "Admin SPMB",
            role: "Panitia SPMB",
            email: "admin@kasatrian.sch.id",
            telepon: "",
            foto: ""
          };
        }
      }

      applyAdminProfileToUI();
    }

    function applyAdminProfileToUI() {
      if (!activeAdmin) return;

      const namaLengkap = activeAdmin.nama;
      
      const sidebarName = document.getElementById('sidebar-user-name');
      const sidebarRole = document.getElementById('sidebar-user-role');
      if (sidebarName) sidebarName.textContent = namaLengkap;
      if (sidebarRole) sidebarRole.textContent = activeAdmin.role;

      const dashNameElem = document.getElementById('dash-admin-name');
      if (dashNameElem) dashNameElem.textContent = namaLengkap;

      const sidebarAvatarImg = document.getElementById('sidebar-avatar-img');
      const sidebarAvatarIcon = document.getElementById('sidebar-avatar-icon');
      const headerAvatarImg = document.getElementById('header-avatar-img');
      const headerAvatarIcon = document.getElementById('header-avatar-icon');

      if (activeAdmin.foto) {
        if (sidebarAvatarImg) {
          sidebarAvatarImg.src = activeAdmin.foto;
          sidebarAvatarImg.classList.remove('hidden');
        }
        if (sidebarAvatarIcon) sidebarAvatarIcon.classList.add('hidden');

        if (headerAvatarImg) {
          headerAvatarImg.src = activeAdmin.foto;
          headerAvatarImg.classList.remove('hidden');
        }
        if (headerAvatarIcon) headerAvatarIcon.classList.add('hidden');
      } else {
        if (sidebarAvatarImg) sidebarAvatarImg.classList.add('hidden');
        if (sidebarAvatarIcon) sidebarAvatarIcon.classList.remove('hidden');

        if (headerAvatarImg) headerAvatarImg.classList.add('hidden');
        if (headerAvatarIcon) headerAvatarIcon.classList.remove('hidden');
      }
    }

    function openProfileModal() {
      if (!activeAdmin) return;

      document.getElementById('admin-nama-input').value = activeAdmin.nama || '';
      document.getElementById('admin-role-input').value = activeAdmin.role || 'Super Admin';
      document.getElementById('admin-email-input').value = activeAdmin.email || '';
      document.getElementById('admin-telepon-input').value = activeAdmin.telepon || '';

      const previewImg = document.getElementById('modal-preview-avatar');
      const previewIcon = document.getElementById('modal-preview-icon');

      if (activeAdmin.foto) {
        previewImg.src = activeAdmin.foto;
        previewImg.classList.remove('hidden');
        previewIcon.classList.add('hidden');
      } else {
        previewImg.classList.add('hidden');
        previewIcon.classList.remove('hidden');
      }

      document.getElementById('modal-edit-profil-admin').classList.remove('hidden');
    }

    function closeProfileModal() {
      document.getElementById('modal-edit-profil-admin').classList.add('hidden');
    }

    document.getElementById('admin-foto-input').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (event) {
          const previewImg = document.getElementById('modal-preview-avatar');
          const previewIcon = document.getElementById('modal-preview-[#1B4332]');
          previewImg.src = event.target.result;
          previewImg.classList.remove('hidden');
          if (previewIcon) previewIcon.classList.add('hidden');
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('form-edit-profil-admin').addEventListener('submit', function (e) {
      e.preventDefault();

      const previewImg = document.getElementById('modal-preview-avatar');
      const newFoto = previewImg.classList.contains('hidden') ? '' : previewImg.src;

      activeAdmin.nama = document.getElementById('admin-nama-input').value.trim();
      activeAdmin.role = document.getElementById('admin-role-input').value;
      activeAdmin.email = document.getElementById('admin-email-input').value.trim();
      activeAdmin.telepon = document.getElementById('admin-telepon-input').value.trim();
      activeAdmin.foto = newFoto;

      localStorage.setItem('currentUser', JSON.stringify(activeAdmin));
      sessionStorage.setItem('currentUser', JSON.stringify(activeAdmin));
      localStorage.setItem('smk_active_session', JSON.stringify({ role: 'admin', ...activeAdmin }));

      applyAdminProfileToUI();
      renderStaffTable();
      closeProfileModal();
      showToast('Profil Admin berhasil diperbarui!');
    });

    function confirmLogout() {
      if (confirm('Apakah Anda yakin ingin keluar dari sistem admin?')) {
        sessionStorage.clear();
        localStorage.removeItem('adminData');
        localStorage.removeItem('loggedInAdmin');
        localStorage.removeItem('currentUser');
        localStorage.removeItem('smk_active_session');
        window.location.href = 'index.html';
      }
    }

    // ==========================================
    // 1. NAVIGASI HALAMAN & LAYOUT
    // ==========================================
    const menuButtons = document.querySelectorAll('.menu-item');
    const sections = document.querySelectorAll('.page-section');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    function switchPage(pageName) {
      menuButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.page === pageName));
      sections.forEach(sec => sec.classList.toggle('hidden', sec.dataset.page !== pageName));
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    }

    menuButtons.forEach(btn => btn.addEventListener('click', () => switchPage(btn.dataset.page)));

    document.getElementById('hamburger').addEventListener('click', () => {
      sidebar.classList.remove('-translate-x-full');
      overlay.classList.remove('hidden');
    });

    overlay.addEventListener('click', () => {
      sidebar.classList.add('-translate-x-full');
      overlay.classList.add('hidden');
    });

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-[#1B4332] text-white border border-emerald-500/30' : 'bg-red-700 text-white';

      toast.className = `pointer-events-auto flex items-center gap-3 p-3.5 rounded-xl shadow-xl text-xs font-medium ${bgColor} transition-all duration-300 transform translate-y-2 opacity-0`;
      
      const icon = type === 'success' ? 'check-circle' : 'alert-circle';
      const iconColor = type === 'success' ? 'text-emerald-400' : 'text-red-300';
      
      toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 ${iconColor}"></i> <span>${message}</span>`;

      container.appendChild(toast);
      if (window.lucide) lucide.createIcons();

      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // ==========================================
    // 2. FETCH DATA REALTIME KE DATABASE (POLLING)
    // ==========================================
    async function loadPendaftarData() {
      try {
        const response = await fetch('../api/list_siswa.php');
        const result = await response.json();
        
        if (result.success && Array.isArray(result.pendaftar)) {
          const newDataString = JSON.stringify(result.pendaftar);
          const oldDataString = JSON.stringify(pendaftarData);
          
          if (newDataString !== oldDataString) {
            pendaftarData = result.pendaftar;
            refreshAllRealtimeComponents(); 
          }
        }
      } catch (e) {
        console.error("Gagal load data dari database:", e);
        // Fallback hanya dipakai jika koneksi mati total
        if (pendaftarData.length === 0) {
            fallbackLocalData(); 
            refreshAllRealtimeComponents();
        }
      }
    }

    function refreshAllRealtimeComponents() {
      renderPendaftarTable();
      renderVerifikasiQueue();
      renderLaporanTable();
      updateDashboardCounts();
      updateJurusanFromPendaftar();
      updateChartsRealtime();
    }

    function fallbackLocalData() {
      pendaftarData = [
        { id: 1, nama: "Laila", nisn: "0051239481", sekolah: "SMP N 1 Surakarta", jurusan: "HTL", tanggal: "2026-02-10", nilai: 88.5, status: "Ditolak" },
        { id: 2, nama: "Bagas Pratama", nisn: "0058823102", sekolah: "SMP N 4 Surakarta", jurusan: "TKR", tanggal: "2026-02-11", nilai: 84.0, status: "Menunggu" },
        { id: 3, nama: "Siti Rahma", nisn: "0059918231", sekolah: "SMP N 2 Surakarta", jurusan: "TKJ", tanggal: "2026-02-12", nilai: 90.0, status: "Diterima" }
      ];
    }

    function updateDashboardCounts() {
      document.getElementById('stat-total').textContent = pendaftarData.length;
      document.getElementById('stat-waiting').textContent = pendaftarData.filter(x => x.status === 'Menunggu' || !x.status).length;
      document.getElementById('stat-accepted').textContent = pendaftarData.filter(x => x.status === 'Diterima').length;
      document.getElementById('stat-rejected').textContent = pendaftarData.filter(x => x.status === 'Ditolak').length;
    }

    document.getElementById('global-search').addEventListener('input', function (e) {
      const keyword = e.target.value.toLowerCase();
      renderPendaftarTable(keyword);
    });

    function renderPendaftarTable(keyword = "") {
      const tbody = document.getElementById('pendaftar-table-body');
      const filter = document.getElementById('filter-status').value;
      tbody.innerHTML = '';

      let filtered = pendaftarData.filter(item => filter === 'semua' || (item.status || 'Menunggu') === filter);

      if (keyword) {
        filtered = filtered.filter(item => 
          (item.nama && item.nama.toLowerCase().includes(keyword)) ||
          (item.nisn && item.nisn.toLowerCase().includes(keyword)) ||
          (item.sekolah && item.sekolah.toLowerCase().includes(keyword)) ||
          (item.jurusan && item.jurusan.toLowerCase().includes(keyword))
        );
      }

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-gray-400">Data pendaftar tidak ditemukan.</td></tr>`;
        return;
      }

      filtered.forEach((item, index) => {
        const st = item.status || 'Menunggu';
        const badgeColor = st === 'Diterima' ? 'bg-emerald-100 text-emerald-800 border-emerald-200' :
          st === 'Ditolak' ? 'bg-red-100 text-red-800 border-red-200' :
          'bg-amber-100 text-amber-800 border-amber-200';

        tbody.innerHTML += `
          <tr class="hover:bg-gray-50/80 transition">
            <td class="p-3.5 font-semibold text-gray-400">${index + 1}</td>
            <td class="p-3.5">
              <p class="font-bold text-[#1B4332]">${item.nama}</p>
              <p class="text-[10px] text-gray-400">NISN: ${item.nisn || '-'}</p>
            </td>
            <td class="p-3.5 text-gray-600">${item.sekolah || '-'}</td>
            <td class="p-3.5"><span class="px-2 py-0.5 bg-emerald-50 text-emerald-800 border border-emerald-200 font-bold text-[10px] rounded-lg">${item.jurusan || '-'}</span></td>
            <td class="p-3.5 text-gray-500">${item.tanggal || new Date().toISOString().split('T')[0]}</td>
            <td class="p-3.5 font-bold text-[#1B4332]">${item.nilai || 0}</td>
            <td class="p-3.5"><span class="px-2.5 py-1 font-bold text-[10px] rounded-full border ${badgeColor}">${st}</span></td>
            <td class="p-3.5 text-center">
              <div class="flex items-center justify-center gap-1.5">
                <button onclick="editSiswa(${item.id})" class="px-2.5 py-1 bg-amber-50 text-amber-700 hover:bg-amber-100 border border-amber-200 font-bold rounded-lg text-[10px] flex items-center gap-1 transition">
                  <i data-lucide="edit" class="w-3 h-3"></i> Edit
                </button>
                <button onclick="hapusSiswa(${item.id})" class="px-2.5 py-1 bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 font-bold rounded-lg text-[10px] flex items-center gap-1 transition">
                  <i data-lucide="trash-2" class="w-3 h-3"></i> Hapus
                </button>
              </div>
            </td>
          </tr>
        `;
      });
      if (window.lucide) lucide.createIcons();
    }

    // ==========================================
    // 3. VERIFIKASI BERKAS REALTIME
    // ==========================================
    function renderVerifikasiQueue() {
      const queueList = document.getElementById('queue-list');
      queueList.innerHTML = '';

      if (pendaftarData.length === 0) {
        queueList.innerHTML = '<p class="text-xs text-gray-400 p-2">Tidak ada pendaftar dalam antrian.</p>';
        resetVerifikasiDetail();
        return;
      }

      pendaftarData.forEach(item => {
        const isSelected = item.id === selectedVerifId;
        const st = item.status || 'Menunggu';
        queueList.innerHTML += `
          <div onclick="selectPendaftarForVerif(${item.id})" class="p-3 rounded-xl border ${isSelected ? 'border-[#22C55E] bg-emerald-50/50' : 'border-gray-200 hover:bg-gray-50'} cursor-pointer transition flex items-center justify-between">
            <div>
              <p class="font-bold text-xs text-[#1B4332]">${item.nama}</p>
              <p class="text-[10px] text-gray-500">${item.sekolah || '-'} • ${item.jurusan || '-'}</p>
            </div>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${st==='Diterima'?'bg-emerald-100 text-emerald-800':st==='Ditolak'?'bg-red-100 text-red-800':'bg-amber-100 text-amber-800'}">${st}</span>
          </div>
        `;
      });

      if (!selectedVerifId || !pendaftarData.some(x => x.id === selectedVerifId)) {
        selectPendaftarForVerif(pendaftarData[0].id);
      }
    }

    function selectPendaftarForVerif(id) {
      const target = pendaftarData.find(x => x.id === id);
      if (!target) return;

      selectedVerifId = id;
      const st = target.status || 'Menunggu';

      document.getElementById('verif-nama').textContent = target.nama;
      document.getElementById('verif-sekolah').textContent = `${target.sekolah || 'SMP N/S'} • Jurusan Pilihan: ${target.jurusan || '-'}`;

      const badge = document.getElementById('verif-status-badge');
      badge.textContent = `Status: ${st}`;
      badge.className = `inline-block mt-1 px-2.5 py-0.5 text-[10px] font-bold rounded-full ${
        st === 'Diterima' ? 'bg-emerald-100 text-emerald-800' :
        st === 'Ditolak' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800'
      }`;

      const grid = document.getElementById('verif-docs-grid');
      grid.innerHTML = `
        <div class="border border-gray-200 rounded-xl p-3 bg-gray-50 space-y-2">
          <p class="font-bold text-xs text-gray-700">Ijazah / Surat Keterangan Lulus</p>
          <img src="https://via.placeholder.com/300x180?text=Ijazah+${encodeURIComponent(target.nama)}" class="w-full h-28 object-cover rounded-lg border">
        </div>
        <div class="border border-gray-200 rounded-xl p-3 bg-gray-50 space-y-2">
          <p class="font-bold text-xs text-gray-700">Kartu Keluarga (KK)</p>
          <img src="https://via.placeholder.com/300x180?text=KK+${encodeURIComponent(target.nama)}" class="w-full h-28 object-cover rounded-lg border">
        </div>
      `;

      renderVerifikasiQueueHighlight();
    }

    function renderVerifikasiQueueHighlight() {
      const queueList = document.getElementById('queue-list');
      const items = queueList.querySelectorAll('div[onclick]');
      pendaftarData.forEach((item, index) => {
        if (items[index]) {
          if (item.id === selectedVerifId) {
            items[index].className = 'p-3 rounded-xl border border-[#22C55E] bg-emerald-50/50 cursor-pointer transition flex items-center justify-between';
          } else {
            items[index].className = 'p-3 rounded-xl border border-gray-200 hover:bg-gray-50 cursor-pointer transition flex items-center justify-between';
          }
        }
      });
    }

    function resetVerifikasiDetail() {
      document.getElementById('verif-nama').textContent = "Tidak Ada Data";
      document.getElementById('verif-sekolah').textContent = "-";
      document.getElementById('verif-status-badge').textContent = "Status: -";
      document.getElementById('verif-docs-grid').innerHTML = '<p class="text-xs text-gray-400 col-span-2">Belum ada dokumen pendaftar.</p>';
    }

    // >>> REALTIME KE DB : UPDATE STATUS VERIFIKASI <<<
    async function prosesVerifikasiStatus(status) {
      if (!selectedVerifId) return;
      const index = pendaftarData.findIndex(x => x.id === selectedVerifId);
      if (index !== -1) {
        try {
          const response = await fetch('../api/update_status_siswa.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: selectedVerifId, status: status })
          });
          const res = await response.json();

          if(res.success) {
            pendaftarData[index].status = status;
            refreshAllRealtimeComponents();
            showToast(`Berkas ${pendaftarData[index].nama} berhasil diperbarui menjadi ${status}`);
          } else {
            showToast('Gagal mengubah status di database!', 'error');
          }
        } catch (e) {
          console.error(e);
          showToast('Koneksi ke server gagal!', 'error');
        }
      }
    }

    // ==========================================
    // 4. REKALKULASI KUOTA JURUSAN
    // ==========================================
    function updateJurusanFromPendaftar() {
      jurusanData.forEach(j => {
        j.terisi = pendaftarData.filter(p => {
          const jur = (p.jurusan || '').toUpperCase();
          const kode = (j.kode || '').toUpperCase();
          return jur.includes(kode) || (j.nama && jur.includes(j.nama.toUpperCase()));
        }).length;
      });
      renderJurusanCards();
    }

    function renderJurusanCards() {
      const grid = document.getElementById('jurusan-cards-grid');
      grid.innerHTML = '';

      jurusanData.forEach(item => {
        const sisa = Math.max(0, item.kuota - item.terisi);
        const persen = Math.min(100, Math.round((item.terisi / item.kuota) * 100));

        grid.innerHTML += `
          <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-sm space-y-3 relative">
            <div class="flex justify-between items-start">
              <div>
                <span class="px-2 py-0.5 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded-md">${item.kode}</span>
                <h3 class="font-bold text-sm text-[#1B4332] mt-1">${item.nama}</h3>
              </div>
              <button onclick="openEditJurusanModal(${item.id})" class="p-1.5 text-gray-400 hover:text-[#1B4332] bg-gray-50 hover:bg-gray-100 rounded-lg transition" title="Edit Jurusan">
                <i data-lucide="edit" class="w-4 h-4"></i>
              </button>
            </div>
            <div>
              <div class="flex justify-between text-xs font-semibold text-gray-600 mb-1">
                <span>Terisi: ${item.terisi} / ${item.kuota}</span>
                <span>Sisa: ${sisa}</span>
              </div>
              <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                <div class="bg-[#22C55E] h-full rounded-full transition-all duration-300" style="width: ${persen}%"></div>
              </div>
            </div>
            <div class="pt-2 border-t border-gray-100 flex items-center justify-between text-xs">
              <span class="text-gray-500 font-medium">Status Gelombang</span>
              <span class="px-3 py-1 rounded-full font-bold text-[10px] ${item.buka?'bg-emerald-100 text-emerald-800':'bg-red-100 text-red-800'}">
                ${item.buka ? 'BUKA' : 'TUTUP'}
              </span>
            </div>
          </div>
        `;
      });
      if (window.lucide) lucide.createIcons();
    }

    function openTambahJurusanModal() {
      document.getElementById('modal-jurusan-title').textContent = "Tambah Jurusan Baru";
      document.getElementById('jurusan-id').value = "";
      document.getElementById('jurusan-kode').value = "";
      document.getElementById('jurusan-nama').value = "";
      document.getElementById('jurusan-kuota').value = "";
      document.getElementById('jurusan-status').value = "true";
      document.getElementById('modal-jurusan').classList.remove('hidden');
    }

    function openEditJurusanModal(id) {
      const item = jurusanData.find(x => x.id === id);
      if (!item) return;

      document.getElementById('modal-jurusan-title').textContent = "Edit Data Jurusan";
      document.getElementById('jurusan-id').value = item.id;
      document.getElementById('jurusan-kode').value = item.kode;
      document.getElementById('jurusan-nama').value = item.nama;
      document.getElementById('jurusan-kuota').value = item.kuota;
      document.getElementById('jurusan-status').value = item.buka ? "true" : "false";
      document.getElementById('modal-jurusan').classList.remove('hidden');
    }

    function closeJurusanModal() {
      document.getElementById('modal-jurusan').classList.add('hidden');
    }

    document.getElementById('form-jurusan').addEventListener('submit', function (e) {
      e.preventDefault();
      const id = document.getElementById('jurusan-id').value;
      const kode = document.getElementById('jurusan-kode').value.trim();
      const nama = document.getElementById('jurusan-nama').value.trim();
      const kuota = parseInt(document.getElementById('jurusan-kuota').value) || 0;
      const buka = document.getElementById('jurusan-status').value === "true";

      if (id) {
        const index = jurusanData.findIndex(x => x.id === parseInt(id));
        if (index !== -1) {
          jurusanData[index] = { ...jurusanData[index], kode, nama, kuota, buka };
          showToast('Data jurusan berhasil diperbarui!');
        }
      } else {
        const newId = jurusanData.length ? Math.max(...jurusanData.map(x => x.id)) + 1 : 1;
        jurusanData.push({ id: newId, kode, nama, kuota, terisi: 0, buka });
        showToast('Jurusan baru berhasil ditambahkan!');
      }

      updateJurusanFromPendaftar();
      closeJurusanModal();
    });

    // ==========================================
    // 5. CHART REALTIME
    // ==========================================
    function initCharts() {
      const ctxTren = document.getElementById('chart-tren');
      if (ctxTren) {
        chartTrenInstance = new Chart(ctxTren.getContext('2d'), {
          type: 'line',
          data: {
            labels: ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'],
            datasets: [{
              label: 'Pendaftar Baru',
              data: [0, 0, 0, 0, 0, 0, pendaftarData.length],
              borderColor: '#22C55E',
              backgroundColor: 'rgba(34, 197, 94, 0.1)',
              fill: true,
              tension: 0.35
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }

      const ctxDistribusi = document.getElementById('chart-distribusi');
      if (ctxDistribusi) {
        chartDistribusiInstance = new Chart(ctxDistribusi.getContext('2d'), {
          type: 'doughnut',
          data: {
            labels: jurusanData.map(j => j.kode),
            datasets: [{
              data: jurusanData.map(j => j.terisi),
              backgroundColor: ['#22C55E', '#3B82F6', '#F59E0B', '#EF4444', '#8B5CF6']
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    }

    function updateChartsRealtime() {
      if (chartDistribusiInstance) {
        chartDistribusiInstance.data.labels = jurusanData.map(j => j.kode);
        chartDistribusiInstance.data.datasets[0].data = jurusanData.map(j => j.terisi);
        chartDistribusiInstance.update();
      }

      if (chartTrenInstance) {
        chartTrenInstance.data.datasets[0].data[6] = pendaftarData.length;
        chartTrenInstance.update();
      }
    }

    // ==========================================
    // 6. LAPORAN
    // ==========================================
    function exportExcel() {
      if (pendaftarData.length === 0) {
        alert('Tidak ada data pendaftar untuk diexport.');
        return;
      }

      let csvContent = "data:text/csv;charset=utf-8,No,Nama Siswa,NISN,Asal Sekolah,Pilihan Jurusan,Nilai Rerata,Status Akhir\n";

      pendaftarData.forEach((item, index) => {
        csvContent += `${index + 1},"${item.nama}","${item.nisn || ''}","${item.sekolah || ''}","${item.jurusan || ''}",${item.nilai || 0},"${item.status || 'Menunggu'}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "Rekapitulasi_SPMB_SMK_Kasatrian_Solo.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      showToast('Laporan berhasil diunduh dalam format CSV/Excel.');
    }

    function cetakLaporanPDF() {
      window.print();
    }

    function renderLaporanTable() {
      const tbody = document.getElementById('laporan-table-body');
      tbody.innerHTML = '';

      pendaftarData.forEach((item, i) => {
        const st = item.status || 'Menunggu';
        tbody.innerHTML += `
          <tr>
            <td class="p-2.5 text-gray-500">${i + 1}</td>
            <td class="p-2.5 font-semibold text-[#1B4332]">${item.nama}</td>
            <td class="p-2.5 text-gray-600">${item.nisn || '-'}</td>
            <td class="p-2.5 text-gray-600">${item.sekolah || '-'}</td>
            <td class="p-2.5 font-bold">${item.jurusan || '-'}</td>
            <td class="p-2.5 font-bold">${item.nilai || 0}</td>
            <td class="p-2.5 font-bold ${st==='Diterima'?'text-emerald-600':st==='Ditolak'?'text-red-600':'text-amber-600'}">${st}</td>
          </tr>
        `;
      });
    }

    // ==========================================
    // 7. MANAJEMEN SISWA & STAFF
    // ==========================================

    function getStoredStaffList() {
      let combinedAdmins = [];
      let uniqueKeys = new Set();

      function addAdmin(nama, email, role, status = 'Aktif') {
        if (!email && !nama) return;
        const key = ((email || '') + '_' + (nama || '')).toLowerCase().trim();
        
        if (!uniqueKeys.has(key)) {
          uniqueKeys.add(key);
          combinedAdmins.push({
            id: combinedAdmins.length + 1,
            nama: nama || "Admin SPMB",
            email: email || "-",
            role: role || "Staf Admin",
            status: status
          });
        }
      }

      const explicitList = JSON.parse(localStorage.getItem('adminList') || '[]');
      explicitList.forEach(item => addAdmin(item.nama, item.email, item.role, item.status || 'Aktif'));

      return combinedAdmins;
    }

    async function renderStaffTable() {
      const tbody = document.getElementById('admin-staff-table-body');
      if (!tbody) return;

      let localStaff = getStoredStaffList();

      try {
        const response = await fetch('../api/list_admin.php');
        if (response.ok) {
          const result = await response.json();
          if (result.success && Array.isArray(result.admins) && result.admins.length > 0) {
            localStaff = result.admins;
          }
        }
      } catch (e) {
      }

      staffData = localStaff;
      tbody.innerHTML = '';

      if (staffData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">Belum ada akun admin terdaftar.</td></tr>`;
        return;
      }

      staffData.forEach((s) => {
        const roleBadgeColor = String(s.role).toLowerCase().includes('super') ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800';
        
        tbody.innerHTML += `
          <tr class="hover:bg-gray-50 transition">
            <td class="p-3.5 font-bold text-[#1B4332]">${s.nama}</td>
            <td class="p-3.5 text-gray-600">${s.email}</td>
            <td class="p-3.5"><span class="px-2.5 py-0.5 ${roleBadgeColor} font-bold rounded-md text-[10px]">${s.role}</span></td>
            <td class="p-3.5"><span class="text-emerald-600 font-bold flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>${s.status || 'Aktif'}</span></td>
            <td class="p-3.5 text-right">
              <button onclick="hapusStaf('${s.email}', '${s.nama}')" class="text-red-600 font-semibold hover:underline text-xs">Hapus</button>
            </td>
          </tr>
        `;
      });
      
      if (window.lucide) lucide.createIcons();
    }

    function openTambahAdminModal() {
      document.getElementById('form-tambah-admin').reset();
      document.getElementById('modal-tambah-admin').classList.remove('hidden');
    }

    function closeTambahAdminModal() {
      document.getElementById('modal-tambah-admin').classList.add('hidden');
    }

    document.getElementById('form-tambah-admin').addEventListener('submit', async function (e) {
      e.preventDefault();
      const nama = document.getElementById('staff-nama').value.trim();
      const email = document.getElementById('staff-email').value.trim();
      const role = document.getElementById('staff-role').value;
      const password = document.getElementById('staff-password').value;

      try {
        await fetch('../api/tambah_admin.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama, email, role, password, status: 'Aktif' })
        });
      } catch (e) {}

      renderStaffTable();
      closeTambahAdminModal();
      showToast('Staf admin baru berhasil ditambahkan!');
    });

    async function hapusStaf(email, nama) {
      if (!confirm(`Apakah Anda yakin ingin menghapus akun admin "${nama}"?`)) return;

      try {
        await fetch('../api/hapus_admin.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, nama })
        });
      } catch (e) {}

      renderStaffTable();
      showToast('Staf admin berhasil dihapus.');
    }

    function renderPengumumanTable() {
      pengumumanList = [
        { id: 1, judul: "Pengumuman Hasil Verifikasi Berkas Tahap 1", kategori: "Kelulusan", target: "Semua Siswa", tanggal: "2026-02-01" }
      ];

      const tbody = document.getElementById('pengumuman-table-body');
      tbody.innerHTML = '';

      pengumumanList.forEach(p => {
        tbody.innerHTML += `
          <tr class="hover:bg-gray-50">
            <td class="p-3 font-bold text-[#1B4332]">${p.judul}</td>

    function editSiswa(id) {
      const siswa = pendaftarData.find(x => x.id === id);
      if (!siswa) return;

      document.getElementById('edit-siswa-id').value = siswa.id;
      document.getElementById('edit-nama').value = siswa.nama;
      document.getElementById('edit-nisn').value = siswa.nisn || '';
      document.getElementById('edit-sekolah').value = siswa.sekolah || '';
      document.getElementById('edit-jurusan').value = siswa.jurusan || 'TKJ';
      document.getElementById('edit-nilai').value = siswa.nilai || 0;
      document.getElementById('edit-status').value = siswa.status || 'Menunggu';

      document.getElementById('modal-edit-siswa').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('modal-edit-siswa').classList.add('hidden');
    }

    // >>> REALTIME KE DB : EDIT DATA SISWA <<<
    document.getElementById('form-edit-siswa').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        id: parseInt(document.getElementById('edit-siswa-id').value),
        nama: document.getElementById('edit-nama').value,
        nisn: document.getElementById('edit-nisn').value,
        sekolah: document.getElementById('edit-sekolah').value,
        jurusan: document.getElementById('edit-jurusan').value,
        nilai: parseFloat(document.getElementById('edit-nilai').value),
        status: document.getElementById('edit-status').value
      };

      try {
        const response = await fetch('../api/edit_siswa.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const res = await response.json();

        if(res.success) {
          const index = pendaftarData.findIndex(x => x.id === payload.id);
          if (index !== -1) {
            pendaftarData[index] = { ...pendaftarData[index], ...payload };
          }
          refreshAllRealtimeComponents();
          closeEditModal();
          showToast('Profil siswa berhasil diperbarui di database!');
        } else {
          showToast('Gagal menyimpan data ke database!', 'error');
        }
      } catch (e) {
        console.error(e);
        showToast('Koneksi ke server gagal!', 'error');
      }
    });

    // >>> REALTIME KE DB : HAPUS DATA SISWA <<<
    async function hapusSiswa(id) {
      if (!confirm('Apakah Anda yakin ingin menghapus data pendaftar ini secara permanen?')) return;

      try {
        const response = await fetch('../api/hapus_siswa.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id })
        });
        const res = await response.json();

        if(res.success) {
          pendaftarData = pendaftarData.filter(x => x.id !== id);
          refreshAllRealtimeComponents();
          showToast('Data pendaftar berhasil dihapus dari database.');
        } else {
          showToast('Gagal menghapus data di database!', 'error');
        }
      } catch (e) {
        console.error(e);
        showToast('Koneksi ke server gagal!', 'error');
      }
    }

    // ==========================================
    // INITIALIZATION & POLLING TIMERS
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      initAuthGuardAndAdminData();
      initCharts();
      loadPendaftarData();
      renderPengumumanTable();
      renderStaffTable();

      // AUTO POLLING: Tarik data terbaru dari DB setiap 5 detik
      setInterval(() => {
        loadPendaftarData();
      }, 5000);

      // AUTO POLLING: Refresh data Staff tiap detik untuk responsivitas login (optional)
      setInterval(() => {
        const currentStaffList = getStoredStaffList();
        const currentHash = JSON.stringify(currentStaffList);
        if (currentHash !== lastStaffHash) {
          lastStaffHash = currentHash;
          renderStaffTable();
        }
      }, 2000);
    });
  </script>
