<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk Akun Siswa | SPMB SMK Kasatrian Solo</title>
<link rel="icon" type="image/png" href="Logo_SMK.png">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="theme.css">
<link href="https://fonts.googleapis.com/css2?family=Kavoon&family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{font-family:'Poppins',sans-serif;}
  .nama-sekolah, .nama-sekolah *{font-family:'Kavoon',cursive !important;}
  :root{ --dark-green:#1B4332; --mint:#D8F5E8; --accent-green:#22C55E; }
  body{font-family:'Poppins',sans-serif; color:var(--dark-green);}
</style>
</head>
<body class="min-h-screen bg-[var(--mint)] flex items-center justify-center p-4 sm:p-8">

<div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row">

  <!-- PANEL KIRI -->
  <div class="w-full md:w-1/2 bg-emerald-600 p-8 flex flex-col text-white justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center">🎓</div>
      <p class="nama-sekolah text-sm leading-tight">SMK KASATRIAN<br>SOLO SUKOHARJO</p>
    </div>

    <div class="text-center py-6">
      <span class="text-6xl">🎒</span>
    </div>

    <div>
      <h2 class="font-bold text-2xl">Portal Calon Siswa 👋</h2>
      <p class="text-xs text-white/80 mt-2">Pantau status seleksi, unduh kartu tes, dan selesaikan berkas pendaftaranmu.</p>
    </div>
  </div>

  <!-- PANEL KANAN -->
  <div class="w-full md:w-1/2 p-8 sm:p-10 space-y-6">
    <div>
      <a href="pilih_peran.html" class="text-xs text-gray-500 hover:text-[var(--dark-green)] font-semibold">← Pilih Peran</a>
      <h1 class="font-bold text-2xl text-[var(--dark-green)] mt-2">Masuk Akun Siswa 🎒</h1>
      <p class="text-xs text-gray-500">Masuk menggunakan email terdaftar</p>
    </div>

    <form id="form-login-siswa" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Email</label>
        <input type="email" id="email" required placeholder="nama@gmail.com" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-xs focus:ring-2 focus:ring-[var(--accent-green)] focus:outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-3 py-2.5 rounded-lg border border-gray-300 text-xs focus:ring-2 focus:ring-[var(--accent-green)] focus:outline-none">
      </div>

      <button type="submit" class="w-full bg-[var(--accent-green)] hover:bg-emerald-600 text-white font-bold py-3 rounded-full text-xs shadow-lg transition">
        Masuk ke Portal Siswa →
      </button>
    </form>

    <div class="border-t border-gray-100 pt-4 text-center">
      <p class="text-xs text-gray-500">Belum mendaftar? <a href="signup_siswa.html" class="text-[var(--accent-green)] font-bold hover:underline">Daftar Akun Baru →</a></p>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
  document.getElementById('form-login-siswa').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const response = await fetch('../api/login_siswa.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const result = await response.json();
    if (!result.success) {
      window.spm.toast(result.message, 'error');
      return;
    }
    localStorage.setItem('smk_active_session', JSON.stringify({ role: 'siswa', ...result.siswa }));
    window.location.href = 'siswa.html';
  });
</script>
</body>
</html>
